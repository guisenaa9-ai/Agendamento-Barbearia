<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conferir publicação</title><style>body{font:17px system-ui;background:#f7f6f2;color:#243e31;max-width:600px;margin:50px auto;padding:25px;line-height:1.7}a{display:block;background:#243e31;color:white;padding:15px;margin-top:25px;text-align:center;border-radius:8px}</style><h1>Conferir publicação</h1><p id="result" role="status">Conferindo a publicação no GitHub Pages…</p><a href="./#cadastro">Abrir cadastro do cliente</a><script>(async()=>{const el=document.getElementById('result');try{const r=await fetch('./?verificar=github',{cache:'no-store'}),text=await r.text();if(!r.ok||!text.includes('id="clientsignup"'))throw Error();el.textContent='Publicação atualizada no GitHub Pages. Cadastro, login e agendamento estão disponíveis.';}catch{el.textContent='A publicação ainda está sendo processada pelo GitHub Pages. Aguarde alguns minutos e atualize.';}})();</script></html>
